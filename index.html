<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Ev Ləzzəti Şirniyyat - CRM</title>
<meta name="description" content="Şirniyyat mağazası üçün müştəri, sifariş və məhsul idarəetmə sistemi"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..900&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "inverse-surface": "#442a22", "on-primary-fixed-variant": "#524249",
                    "on-error-container": "#93000a", "error-container": "#ffdad6",
                    "surface-container-highest": "#ffdbd0", "surface-variant": "#ffdbd0",
                    "outline": "#7f7478", "inverse-on-surface": "#ffede8",
                    "primary-container": "#fce4ec", "surface-tint": "#6b5a60",
                    "on-primary-container": "#76646b", "primary-fixed": "#f4dce4",
                    "primary": "#6b5a60", "on-error": "#ffffff",
                    "secondary-container": "#fed7ca", "on-background": "#2c160e",
                    "tertiary": "#636037", "error": "#ba1a1a",
                    "surface-container-high": "#ffe2da", "outline-variant": "#d0c3c7",
                    "surface": "#fff8f6", "surface-container-lowest": "#ffffff",
                    "secondary": "#75584d", "on-primary": "#ffffff",
                    "surface-container": "#ffe9e3", "surface-container-low": "#fff1ed",
                    "on-secondary-container": "#795c51", "surface-bright": "#fff8f6",
                    "on-secondary": "#ffffff", "background": "#fff8f6",
                    "on-tertiary": "#ffffff", "on-surface-variant": "#4d4447",
                    "tertiary-container": "#f2ecb8", "on-surface": "#2c160e",
                    "on-tertiary-container": "#6e6b41"
                },
                borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
                spacing: { xl: "64px", "margin-mobile": "20px", xs: "8px", md: "24px", gutter: "16px", sm: "16px", base: "4px", lg: "40px", "margin-desktop": "48px" },
                fontFamily: {
                    "label-md": ["Plus Jakarta Sans"], "headline-md": ["Literata"], "headline-lg": ["Literata"],
                    "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-sm": ["Literata"],
                    "body-lg": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"]
                }
            }
        }
    }
</script>
<style>
    body {
      color: #2c160e;
      background: linear-gradient(180deg, #c99470 0%, #a06a49 45%, #6e4128 100%);
      background-attachment: fixed;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .brand-title {
        background: linear-gradient(90deg, #75584d, #b8886f, #75584d);
        background-size: 200% auto;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: brandShine 4s linear infinite, brandPulse 2.8s ease-in-out infinite;
        display: inline-block;
    }
    @keyframes brandShine { to { background-position: 200% center; } }
    @keyframes brandPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    .brand-emoji { animation: brandWiggle 2.6s ease-in-out infinite; display: inline-block; transform-origin: 70% 70%; }
    @keyframes brandWiggle { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
    /* Qəbz çapı */
    .receipt-paper { font-family: 'Courier New', monospace; width: 280px; margin: 0 auto; color: #111; }
    .receipt-paper .rline { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
    @media print {
      @page { size: 80mm auto; margin: 4mm; }
      html, body { height: auto !important; min-height: 0 !important; margin: 0 !important; padding: 0 !important; background: #fff !important; }
      body * { visibility: hidden; }
      #receipt-print-area, #receipt-print-area * { visibility: visible; }
      #receipt-print-area {
        position: absolute; top: 0; left: 0; width: 100% !important;
        margin: 0 !important; border: none !important; box-shadow: none !important; padding: 0 !important;
      }
      header, nav, footer { display: none !important; }
      #modal-root > div { position: static !important; background: none !important; backdrop-filter: none !important; min-height: 0 !important; padding: 0 !important; }
      #modal-root > div > div { max-height: none !important; overflow: visible !important; border-radius: 0 !important; }
      #modal-root button { display: none !important; }
    }
    .glass-card { background: linear-gradient(135deg, #ffffff 0%, #fff1ed 100%); border: 1px solid #fce4ec; box-shadow: 0 8px 32px 0 rgba(141, 110, 99, 0.1); }
    .soft-shadow { box-shadow: 0 4px 16px rgba(141, 110, 99, 0.08); }
    .modal-backdrop { background: rgba(44, 22, 14, 0.5); backdrop-filter: blur(2px); }
    .fade-in { animation: fadeIn .25s ease-out; }
    .slide-up { animation: slideUp .3s cubic-bezier(.16,1,.3,1); }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes slideUp { from { opacity:0; transform: translateY(24px) } to { opacity:1; transform: translateY(0) } }
    .toast-anim { animation: toastIn .3s ease-out, toastOut .3s ease-in 2.2s forwards; }
    @keyframes toastIn { from { opacity:0; transform: translateY(-16px) } to { opacity:1; transform: translateY(0) } }
    @keyframes toastOut { to { opacity:0; transform: translateY(-16px) } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #d0c3c7; border-radius: 8px; }
    .nav-active { background: #fed7ca; color: #795c51; }
    .skeleton { background: linear-gradient(90deg, #ffe9e3 25%, #fff1ed 50%, #ffe9e3 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
</style>
</head>
<body class="antialiased pb-24 md:pb-0">

<header class="w-full top-0 sticky shadow-sm bg-[#f0d5bf]/90 backdrop-blur-md z-40">
  <div class="flex justify-between items-center px-margin-mobile py-3 w-full max-w-7xl mx-auto">
    <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('dashboard')">
      <img src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Shortcake/3D/shortcake_3d.png" alt="Tort" class="w-11 h-11 brand-emoji object-contain" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Birthday%20cake/3D/birthday_cake_3d.png'"/>
      <span class="text-2xl md:text-3xl font-headline-md font-headline-md brand-title">Ev Ləzzəti Şirniyyat</span>
    </div>
    <div class="hidden md:flex items-center gap-6">
      <a onclick="navigate('dashboard')" data-nav="dashboard" class="nav-link text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors cursor-pointer pb-1">Ana Səhifə</a>
      <a onclick="navigate('pos')" data-nav="pos" class="nav-link text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors cursor-pointer pb-1">Satış</a>
      <a onclick="navigate('products')" data-nav="products" class="nav-link text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors cursor-pointer pb-1">Məhsullar</a>
      <a onclick="navigate('orders')" data-nav="orders" class="nav-link text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors cursor-pointer pb-1">Sifarişlər</a>
      <a onclick="navigate('customers')" data-nav="customers" class="nav-link text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors cursor-pointer pb-1">Müştərilər</a>
      <a onclick="navigate('reports')" data-nav="reports" class="nav-link text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors cursor-pointer pb-1">Hesabatlar</a>
    </div>
    <button onclick="navigate('settings')" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-surface-container transition-colors">
      <span class="material-symbols-outlined text-on-surface-variant">settings</span>
    </button>
  </div>
</header>

<main id="app" class="w-full max-w-7xl mx-auto px-margin-mobile py-md"></main>

<div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center"></div>
<div id="modal-root"></div>

<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 bg-surface/90 backdrop-blur-md border-t border-surface-variant/30 shadow-lg rounded-t-xl pb-safe">
  <div class="flex items-center gap-1 px-2 py-2 overflow-x-auto no-scrollbar" style="scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;">
    <a onclick="navigate('dashboard')" data-nav="dashboard" class="bottom-nav-link flex flex-col items-center justify-center rounded-full px-4 py-1 transition-all duration-200 cursor-pointer shrink-0" style="scroll-snap-align:start;">
      <span class="material-symbols-outlined">storefront</span>
      <span class="text-label-sm font-label-sm mt-1">Ana Səhifə</span>
    </a>
    <a onclick="navigate('pos')" data-nav="pos" class="bottom-nav-link flex flex-col items-center justify-center rounded-full px-4 py-1 transition-colors cursor-pointer shrink-0" style="scroll-snap-align:start;">
      <span class="material-symbols-outlined">point_of_sale</span>
      <span class="text-label-sm font-label-sm mt-1">Satış</span>
    </a>
    <a onclick="navigate('products')" data-nav="products" class="bottom-nav-link flex flex-col items-center justify-center rounded-full px-4 py-1 transition-colors cursor-pointer shrink-0" style="scroll-snap-align:start;">
      <span class="material-symbols-outlined">bakery_dining</span>
      <span class="text-label-sm font-label-sm mt-1">Məhsullar</span>
    </a>
    <a onclick="navigate('orders')" data-nav="orders" class="bottom-nav-link flex flex-col items-center justify-center rounded-full px-4 py-1 transition-colors cursor-pointer shrink-0" style="scroll-snap-align:start;">
      <span class="material-symbols-outlined">shopping_bag</span>
      <span class="text-label-sm font-label-sm mt-1">Sifarişlər</span>
    </a>
    <a onclick="navigate('customers')" data-nav="customers" class="bottom-nav-link flex flex-col items-center justify-center rounded-full px-4 py-1 transition-colors cursor-pointer shrink-0" style="scroll-snap-align:start;">
      <span class="material-symbols-outlined">group</span>
      <span class="text-label-sm font-label-sm mt-1">Müştərilər</span>
    </a>
    <a onclick="navigate('reports')" data-nav="reports" class="bottom-nav-link flex flex-col items-center justify-center rounded-full px-4 py-1 transition-colors cursor-pointer shrink-0" style="scroll-snap-align:start;">
      <span class="material-symbols-outlined">bar_chart</span>
      <span class="text-label-sm font-label-sm mt-1">Hesabatlar</span>
    </a>
  </div>
</nav>

<footer class="w-full text-center py-4 text-label-sm font-label-sm text-[#fbe9dd]">
  <a href="https://instagram.com/securtiy_group" target="_blank" rel="noopener" class="hover:text-white transition-colors opacity-90 hover:opacity-100">By securtiy_group</a>
</footer>

<script src="app.js"></script>
</body>
</html>
