<body class="antialiased min-h-screen flex flex-col font-body-md text-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="w-full top-0 sticky shadow-sm bg-surface z-50">
<div class="flex justify-between items-center px-margin-mobile py-base w-full max-w-7xl mx-auto min-h-[56px]">
<div class="flex items-center gap-sm">
<button aria-label="Geri" class="p-2 -ml-2 rounded-full hover:bg-primary-container/20 text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 400;">arrow_back</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-secondary">Yeni Kateqoriya</h1>
</div>
<div>
<!-- Trailing space if needed -->
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-3xl mx-auto px-margin-mobile py-md pb-xl">
<form class="space-y-lg">
<!-- Category Name Input -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="category-name">Kateqoriya adı</label>
<div class="relative">
<input class="w-full px-sm py-3 rounded-lg bg-[#fff1ed] border-transparent focus:border-[#fce4ec] focus:ring-2 focus:ring-[#fce4ec] text-on-surface placeholder:text-on-surface-variant/50 transition-all font-body-md text-body-md" id="category-name" name="category-name" placeholder="Məs. Milli şirniyyatlar" required="" type="text"/>
</div>
</div>
<!-- Icon Selection -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">İkon seçin</label>
<div class="grid grid-cols-4 gap-xs sm:gap-sm bg-surface-container-lowest p-sm rounded-xl soft-shadow border border-[#FCE4EC]/50">
<!-- Icon Option 1 (Selected) -->
<label class="cursor-pointer group">
<input checked="" class="peer sr-only" name="category-icon" type="radio" value="cake"/>
<div class="aspect-square flex items-center justify-center rounded-lg bg-surface peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:ring-2 peer-checked:ring-primary-container transition-all hover:bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined text-[32px]">cake</span>
</div>
</label>
<!-- Icon Option 2 -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="category-icon" type="radio" value="cookie"/>
<div class="aspect-square flex items-center justify-center rounded-lg bg-surface peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:ring-2 peer-checked:ring-primary-container transition-all hover:bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined text-[32px]">cookie</span>
</div>
</label>
<!-- Icon Option 3 -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="category-icon" type="radio" value="bakery_dining"/>
<div class="aspect-square flex items-center justify-center rounded-lg bg-surface peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:ring-2 peer-checked:ring-primary-container transition-all hover:bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined text-[32px]">bakery_dining</span>
</div>
</label>
<!-- Icon Option 4 -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="category-icon" type="radio" value="icecream"/>
<div class="aspect-square flex items-center justify-center rounded-lg bg-surface peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:ring-2 peer-checked:ring-primary-container transition-all hover:bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined text-[32px]">icecream</span>
</div>
</label>
<!-- Icon Option 5 -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="category-icon" type="radio" value="local_cafe"/>
<div class="aspect-square flex items-center justify-center rounded-lg bg-surface peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:ring-2 peer-checked:ring-primary-container transition-all hover:bg-surface-container-high text-on-surface-variant">

<span class="material-symbols-outlined text-[20px]">add</span>
