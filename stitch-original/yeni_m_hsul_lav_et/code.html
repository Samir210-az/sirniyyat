<!DOCTYPE html>

<html lang="az"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:items-center md:justify-center md:bg-surface-variant">
<!-- Mobile Container (Simulated for Web View) -->
<main class="w-full h-full flex flex-col relative md:max-w-md md:h-[850px] md:rounded-[32px] md:shadow-xl md:overflow-hidden bg-background">
<!-- Top App Bar (Transactional, no bottom nav needed) -->
<header class="w-full top-0 sticky z-40 bg-surface/90 backdrop-blur-md shadow-sm">
<div class="flex items-center px-margin-mobile py-sm">
<!-- Back Button -->
<button aria-label="Geri qayıt" class="p-2 -ml-2 rounded-full hover:bg-primary-container/20 active:scale-95 transition-transform text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Title -->
<h1 class="flex-1 text-center font-headline-sm text-headline-sm text-on-surface ml-[-24px] pointer-events-none">
                    Yeni Məhsul Əlavə Et
                </h1>
</div>
</header>
<!-- Main Form Content -->
<div class="flex-1 overflow-y-auto px-margin-mobile py-md pb-xl space-y-md">
<!-- Image Upload Area -->
<div class="w-full aspect-[4/3] rounded-xl bg-surface-container flex flex-col items-center justify-center border-2 border-dashed border-outline-variant hover:border-primary cursor-pointer transition-colors relative overflow-hidden group">
<span class="material-symbols-outlined text-4xl text-primary mb-2 group-hover:scale-110 transition-transform" data-icon="add_a_photo" style="font-variation-settings: 'FILL' 0;">add_a_photo</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Şəkil yüklə (İstəyə bağlı)</span>
<!-- Hidden file input would go here -->
</div>
<!-- Form Fields -->
<form class="space-y-md">
<!-- Product Name -->
<div class="space-y-base">
<label class="block font-body-md text-body-md font-bold text-on-surface" for="productName">Məhsulun adı</label>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-transparent focus:border-primary-container focus:ring-0 rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-colors" id="productName" placeholder="Məsələn: Ballı Tort" type="text"/>
</div>
<!-- Description -->
<div class="space-y-base">
<label class="block font-body-md text-body-md font-bold text-on-surface" for="productDesc">Təsviri</label>
<textarea class="w-full bg-surface-container-low border-0 border-b-2 border-transparent focus:border-primary-container focus:ring-0 rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-colors resize-none" id="productDesc" placeholder="Məhsul haqqında qısa məlumat..." rows="3"></textarea>
</div>
<!-- Price and Category Row -->
<div class="grid grid-cols-2 gap-sm">
<!-- Price -->
<div class="space-y-base relative">
<label class="block font-body-md text-body-md font-bold text-on-surface" for="productPrice">Qiyməti</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 border-b-2 border-transparent focus:border-primary-container focus:ring-0 rounded-lg pl-4 pr-12 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-colors" id="productPrice" placeholder="0.00" step="0.10" type="number"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
<span class="font-body-md text-body-md text-on-surface-variant">AZN</span>
</div>
</div>
</div>
<!-- Category -->
<div class="space-y-base">
<label class="block font-body-md text-body-md font-bold text-on-surface" for="productCategory">Kateqoriya</label>
<div class="relative">
<select class="w-full bg-surface-container-low border-0 border-b-2 border-transparent focus:border-primary-container focus:ring-0 rounded-lg pl-4 pr-10 py-3 font-body-md text-body-md text-on-surface appearance-none transition-colors" id="productCategory">
<option disabled="" selected="" value="">Seçin...</option>
<option value="tortlar">Tortlar</option>
<option value="sirniyyatlar">Şirniyyatlar</option>
<option value="milli">Milli</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</div>
<!-- In Stock Toggle -->
<div class="flex items-center justify-between py-sm mt-xs border-t border-surface-variant/30">
<div class="flex flex-col">
<span class="font-body-md text-body-md font-bold text-on-surface">Stokda var</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Müştərilərə sifariş üçün açıqdır</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
</label>
</div>
</form>
</div>
<!-- Sticky Bottom Action -->
<div class="w-full p-margin-mobile bg-background/95 backdrop-blur-sm border-t border-surface-variant/30 pb-[calc(20px+env(safe-area-inset-bottom))]">
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-4 rounded-xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-[0_4px_12px_rgba(141,110,99,0.15)]" type="button">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Əlavə et
            </button>
</div>
</main>
</body></html>
